# VulWall self-hosted stack.
#
#   cp .env.example .env
#   echo "SETUP_TOKEN=$(openssl rand -hex 16)" >> .env
#   docker compose up -d
#   then open http://localhost:8080/setup?token=<SETUP_TOKEN from .env>
#
# Optional tracing (Jaeger UI on http://localhost:16686):
#   set OTEL_ENABLED=true in .env, then
#   docker compose --profile tracing up -d

name: vulwall

services:
  mongo:
    image: mongo:7.0.29@sha256:606f8e029603330411a7dd10b5ffd50eefc297fc80cee89f10a455e496a76ae7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  scanner:
    build:
      context: ./scanner
      args:
        # Version shown in the About dialog. `make build` sets "dev (<commit>)";
        # release images get the tag from release.yml.
        VULWALL_VERSION: ${VULWALL_BUILD_VERSION:-dev}
    image: ghcr.io/vulwall/scanner:${VULWALL_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: vulwall
      REDIS_URI: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      NUCLEI_WORKERS: ${NUCLEI_WORKERS:-2}
      NUCLEI_RATE_LIMIT: ${NUCLEI_RATE_LIMIT:-30}
      NUCLEI_INTERACTSH: ${NUCLEI_INTERACTSH:-off}
      NUCLEI_INTERACTSH_SERVER: ${NUCLEI_INTERACTSH_SERVER:-}
      NUCLEI_INTERACTSH_TOKEN: ${NUCLEI_INTERACTSH_TOKEN:-}
      NUCLEI_TEMPLATE_UPDATE_CRON: ${NUCLEI_TEMPLATE_UPDATE_CRON:-}
      # Same defaults as scanner/src/internal/active_recon/nuclei_scanner/constants.go.
      # The scanner reads an empty value as "no filter", so an empty line in .env must not
      # reach it: keep these defaults in sync with the constants.
      NUCLEI_INCLUDE_TAGS: ${NUCLEI_INCLUDE_TAGS:-cve,vuln,exposure,misconfig,default-login,token,takeover,kev,xss,lfi,ssrf,rce,sqli,auth-bypass,unauth,panel}
      NUCLEI_EXCLUDE_TAGS: ${NUCLEI_EXCLUDE_TAGS:-intrusive,dos,fuzz}
      TESTSSL_CONCURRENCY: ${TESTSSL_CONCURRENCY:-5}
      DNS_RESOLVE_CONCURRENCY: ${DNS_RESOLVE_CONCURRENCY:-50}
      DNS_RECHECK_RESOLVERS: ${DNS_RECHECK_RESOLVERS:-}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      GEO_DOWNLOAD: ${GEO_DOWNLOAD:-true}
      GEO_MAX_AGE_DAYS: ${GEO_MAX_AGE_DAYS:-35}
      CLOUD_DETECTOR_ENABLED: ${CLOUD_DETECTOR_ENABLED:-true}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-vulwall-scanner}
      # The OpenTelemetry SDK reads these too and logs an error for an empty sampler name.
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    volumes:
      - nuclei-templates:/data/nuclei-templates
      - geo-data:/data/geo

  web:
    build:
      context: ./web
      args:
        # Version shown in the About dialog. `make build` sets "dev (<commit>)";
        # release images get the tag from release.yml.
        VULWALL_VERSION: ${VULWALL_BUILD_VERSION:-dev}
    image: ghcr.io/vulwall/web:${VULWALL_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # Loopback only: put a TLS reverse proxy in front to reach VulWall from other machines
      # (see "Exposing VulWall" in README.md). Docker-published ports bypass ufw/firewalld,
      # so the line below exposes plain HTTP to everyone who can reach this host:
      # - "${VULWALL_PORT:-8080}:8080"
      - "127.0.0.1:${VULWALL_PORT:-8080}:8080"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: vulwall
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The web app reads an empty value as the model name, so pass the default here.
      DEFAULT_AI_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    volumes:
      # Data-protection keys that sign the auth cookies. Kept off MongoDB so the scanner,
      # which shares the database, cannot forge a login.
      - web-keys:/data/keys

  jaeger:
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    profiles: ["tracing"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

volumes:
  mongo-data:
  redis-data:
  nuclei-templates:
  geo-data:
  web-keys:
