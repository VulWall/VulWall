version: 2
updates:
  - package-ecosystem: gomod
    directory: /scanner/src
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /web
    schedule:
      interval: weekly
    groups:
      nuget-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /scanner/docker/retire
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /scanner
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-dependencies:
        patterns: ["*"]
