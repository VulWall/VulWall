name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    name: ghcr.io/vulwall/${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # sign the provenance attestation
      attestations: write  # store the provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: scanner
            context: ./scanner
          - image: web
            context: ./web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/vulwall/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VULWALL_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vulwall/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # Matrix legs cannot each set a job output, so every leg hands its digest
      # to the release job as an artifact.
      - name: Save the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'
          mkdir -p digest
          printf '%s\n' "$DIGEST" > "digest/${{ matrix.image }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digest/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true  # a re-run of the workflow uploads it again

  release:
    name: GitHub Release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digest
          merge-multiple: true
      - name: Build release assets
        run: |
          SCANNER_DIGEST=$(cat digest/scanner) WEB_DIGEST=$(cat digest/web) \
            scripts/release-assets.sh "$GITHUB_REF_NAME" dist
          grep -q '/scanner:.*@sha256:' dist/docker-compose.yml
          grep -q '/web:.*@sha256:' dist/docker-compose.yml
      - name: Validate the release compose file
        working-directory: dist
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml --profile tracing config -q
          sha256sum -c SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=yes ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of this workflow: replace the assets of the existing release.
            gh release upload "$TAG" --clobber \
              dist/docker-compose.yml dist/env.example dist/vulwall dist/SHA256SUMS
          else
            gh release create "$TAG" ${prerelease:+--prerelease} --verify-tag \
              --title "VulWall $TAG" \
              --notes "See [CHANGELOG.md](https://github.com/VulWall/VulWall/blob/$TAG/CHANGELOG.md). Install or upgrade: \`curl -fsSL https://vulwall.com/install.sh | sh\`" \
              dist/docker-compose.yml dist/env.example dist/vulwall dist/SHA256SUMS
          fi
