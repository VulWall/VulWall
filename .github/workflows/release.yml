# Releases (see "Releases" in CONTRIBUTING.md):
#
# 1. Every push to main runs release-please. From the conventional commit
#    subjects since the last release it opens or updates one release PR,
#    "chore: release vX.Y.Z", which changes only CHANGELOG.md and
#    .release-please-manifest.json.
# 2. Merging that PR makes release-please create the tag vX.Y.Z and a draft
#    GitHub Release with the changelog entry as notes.
# 3. The image and release jobs below then build and publish the images for
#    that tag, attest them, attach the release assets and publish the draft.
#    They run in this workflow because a tag created with GITHUB_TOKEN does
#    not start other workflows.
#
# Manual fallback: run this workflow by hand on an existing tag,
#   gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z
# (--ref makes the provenance record the tag). It builds and publishes that
# tag and creates its release, or completes the existing (draft) release.
# There is no tag-push trigger, so a tag never starts a second run.
#
# "latest" (image tag and release mark) goes only to the highest stable tag,
# and the X.Y image tag only to the highest patch of its line.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v0.1.2
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    # A queued run waits instead of cancelling one that may be creating a release.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write       # release branch commits, tag and draft release
      pull-requests: write  # open and update the release PR
      issues: write         # create and set the "autorelease: ..." labels
    outputs:
      # The tag to build and publish, or empty when there is nothing to release.
      tag: ${{ steps.tag.outputs.tag }}
      # "true" when the tag is the highest stable release overall, and within
      # its major.minor line; a fix for an older line must not move "latest".
      latest: ${{ steps.tag.outputs.latest }}
      minor_latest: ${{ steps.tag.outputs.minor_latest }}
    steps:
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Optional RELEASE_PLEASE_TOKEN (GitHub App or fine-grained token):
          # a release PR opened with GITHUB_TOKEN does not start CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: tag
        name: Select the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          tag=
          if [ "$EVENT" = workflow_dispatch ]; then
            tag=$INPUT_TAG
          elif [ "$RELEASE_CREATED" = true ]; then
            tag=$RELEASE_TAG
          fi
          if [ -z "$tag" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # [[ =~ ]] matches the whole string, so a newline cannot slip through.
          if ! [[ $tag =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a release tag: $tag"
            exit 1
          fi
          line="^v${BASH_REMATCH[1]}\\.${BASH_REMATCH[2]}\\."
          # The tag already exists (release-please or the maintainer created it),
          # so it is among these refs.
          refs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref')
          stable=$(grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' <<< "${refs//refs\/tags\//}" | sort -V || true)
          latest=false
          minor_latest=false
          if [[ $tag != *-* ]]; then
            [ "$tag" = "$(tail -n 1 <<< "$stable")" ] && latest=true
            [ "$tag" = "$(grep -E "$line" <<< "$stable" | tail -n 1)" ] && minor_latest=true
          fi
          echo "$tag: latest=$latest minor_latest=$minor_latest"
          {
            echo "tag=$tag"
            echo "latest=$latest"
            echo "minor_latest=$minor_latest"
          } >> "$GITHUB_OUTPUT"

  image:
    name: ghcr.io/vulwall/${{ matrix.image }}
    needs: release-please
    if: needs.release-please.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # sign the provenance attestation
      attestations: write  # store the provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: scanner
            context: ./scanner
          - image: web
            context: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag }}
      # The tagged commit; on main or a manual run it can differ from github.sha.
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/vulwall/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }},enable=${{ needs.release-please.outputs.minor_latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VULWALL_VERSION=${{ needs.release-please.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vulwall/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # Matrix legs cannot each set a job output, so every leg hands its digest
      # to the release job as an artifact.
      - name: Save the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'
          mkdir -p digest
          printf '%s\n' "$DIGEST" > "digest/${{ matrix.image }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digest/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true  # a re-run of the workflow uploads it again

  release:
    name: GitHub Release
    needs: [release-please, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      LATEST: ${{ needs.release-please.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digest
          merge-multiple: true
      - name: Build release assets
        run: |
          SCANNER_DIGEST=$(cat digest/scanner) WEB_DIGEST=$(cat digest/web) \
            scripts/release-assets.sh "$TAG" dist
          grep -q '/scanner:.*@sha256:' dist/docker-compose.yml
          grep -q '/web:.*@sha256:' dist/docker-compose.yml
      - name: Validate the release compose file
        working-directory: dist
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml --profile tracing config -q
          sha256sum -c SHA256SUMS
      # install.sh downloads from releases/latest, so a release is published
      # only after its assets are attached.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          if view=$(gh release view "$TAG" --json tagName 2>&1); then
            # The draft release from release-please, or a re-run: attach the
            # assets, then publish.
            gh release upload "$TAG" --clobber \
              dist/docker-compose.yml dist/env.example dist/vulwall dist/SHA256SUMS
            gh release edit "$TAG" --draft=false --prerelease="$prerelease" \
              --latest="$LATEST" --title "VulWall $TAG"
          elif [[ $view != *"release not found"* ]]; then
            # Any other error (API, auth) must not lead to a second release.
            echo "$view" >&2
            exit 1
          else
            gh release create "$TAG" --prerelease="$prerelease" --latest="$LATEST" --verify-tag \
              --title "VulWall $TAG" \
              --notes "See [CHANGELOG.md](https://github.com/VulWall/VulWall/blob/$TAG/CHANGELOG.md). Install or upgrade: \`curl -fsSL https://vulwall.com/install.sh | sh\`" \
              dist/docker-compose.yml dist/env.example dist/vulwall dist/SHA256SUMS
          fi
