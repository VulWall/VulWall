name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner:
    name: Scanner (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner/src
    # The Mongo- and Redis-backed tests skip without these; pinned like docker-compose.yml.
    services:
      mongo:
        image: mongo:7.0.29@sha256:606f8e029603330411a7dd10b5ffd50eefc297fc80cee89f10a455e496a76ae7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VULWALL_TEST_MONGO_URI: mongodb://localhost:27017
      VULWALL_TEST_REDIS_URI: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: scanner/src/go.mod
          cache-dependency-path: scanner/src/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 -p 1 ./...

  web:
    name: Web (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
      - run: dotnet build web/src/VulWall.Dashboard.csproj -c Release
      - run: dotnet test web/tests/VulWall.Dashboard.Tests -c Release

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config -q
      - run: docker compose --profile tracing config -q

  workflows:
    name: Workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      # go install verifies the module against the Go checksum database.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: "\"$(go env GOPATH)/bin/actionlint\" -color"

  scripts:
    name: Installer and helper scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck install.sh scripts/vulwall scripts/release-assets.sh scripts/demo-seed scripts/test/install_test.sh
      - run: dash scripts/test/install_test.sh
