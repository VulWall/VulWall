name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner:
    name: Scanner (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: scanner/src/go.mod
          cache-dependency-path: scanner/src/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  web:
    name: Web (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build web/src/VulWall.Dashboard.csproj -c Release
      - run: dotnet test web/tests/VulWall.Dashboard.Tests -c Release

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose config -q
      - run: docker compose --profile tracing config -q
