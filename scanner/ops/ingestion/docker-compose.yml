version: '3.8'

services:
  ingestion:
    build:
      context: ../..
      dockerfile: ops/ingestion/Dockerfile
    container_name: nightwatch-ingestion
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - MONGO_URI=${MONGO_URI}
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-x", "ingestion"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
