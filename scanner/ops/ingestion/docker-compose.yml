services:
  ingestion:
    build:
      context: ../..
      dockerfile: ops/ingestion/Dockerfile
    container_name: nightwatch-ingestion
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URI=${REDIS_URI}
      - MONGO_URI=${MONGO_URI}
      - IP_ENRICHMENT_DB_PATH=/root/data/dbip-isp-country.mmdb
    volumes:
      - ${MMDB_PATH:-/opt/vulwall/dbip-isp-country.mmdb}:/root/data/dbip-isp-country.mmdb:ro
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "ingestion"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
