name: nw-port-discovery

services:
  port-discovery:
    image: ghcr.io/mojtabatajik/nightwatch-port-discovery:${IMAGE_TAG:-dev}
    container_name: nw-port-discovery
    restart: unless-stopped
    env_file:
      - /opt/vulwall/config/general.env
      - /opt/vulwall/config/redis.env
      - /opt/vulwall/config/honeycomb.env
      - /opt/vulwall/config/shodan.env
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "port-discovery"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
