services:
  port-discovery:
    build:
      context: ../..
      dockerfile: ops/port-discovery/Dockerfile
    container_name: nightwatch-port-discovery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URI=${REDIS_URI}
      - MONGO_URI=${MONGO_URI}
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-x", "port-discovery"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
