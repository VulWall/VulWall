name: nw-port-discovery

services:
  port-discovery:
    image: ghcr.io/vulwall/port-discovery:${IMAGE_TAG:-dev}
    container_name: nw-port-discovery
    restart: unless-stopped
    read_only: true
    stop_grace_period: 30s
    env_file:
      - /opt/vulwall/config/general.env
      - /opt/vulwall/config/redis.env
      - /opt/vulwall/config/honeycomb.env
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "port-discovery"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
