version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vulwall
    volumes:
      - mongo_data:/data/db

  passive-recon:
    build:
      context: ..
      dockerfile: ops/Dockerfile.passive-recon
    environment:
      - REDIS_ADDR=redis:6379
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=vulwall
      - SERVICE_NAME=passive-recon
      - ENVIRONMENT=production
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped
    deploy:
      replicas: 2

  active-recon:
    build:
      context: ..
      dockerfile: ops/Dockerfile.active-recon
    environment:
      - REDIS_ADDR=redis:6379
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=vulwall
      - SERVICE_NAME=active-recon
      - ENVIRONMENT=production
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped
    deploy:
      replicas: 2

volumes:
  redis_data:
  mongo_data:
