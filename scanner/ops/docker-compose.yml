version: '3.8'

services:
  passive-recon:
    build:
      context: ..
      dockerfile: ops/Dockerfile.passive-recon
    environment:
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=${MONGO_DB:-vulwall}
      - SERVICE_NAME=passive-recon
      - ENVIRONMENT=${ENVIRONMENT:-production}
    restart: unless-stopped
    deploy:
      replicas: 2

  active-recon:
    build:
      context: ..
      dockerfile: ops/Dockerfile.active-recon
    environment:
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=${MONGO_DB:-vulwall}
      - SERVICE_NAME=active-recon
      - ENVIRONMENT=${ENVIRONMENT:-production}
    restart: unless-stopped
    deploy:
      replicas: 2

  attack-surface:
    build:
      context: ..
      dockerfile: ops/Dockerfile.attack-surface
    environment:
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=${MONGO_DB:-vulwall}
      - SERVICE_NAME=attack-surface
      - ENVIRONMENT=${ENVIRONMENT:-production}
    restart: unless-stopped
    deploy:
      replicas: 2
