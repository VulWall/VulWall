services:
  scan-coordinator:
    image: ghcr.io/vulwall/nightwatch-scan-coordinator:${IMAGE_TAG:-dev}
    container_name: nightwatch-scan-coordinator
    restart: unless-stopped
    env_file:
      - /opt/vulwall/redis.env
      - /opt/vulwall/mongo.env
      - /opt/vulwall/honeycomb.env
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "scan-coordinator"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
