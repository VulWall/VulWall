name: nw-scan-coordinator

services:
  scan-coordinator:
    image: ghcr.io/vulwall/nightwatch-scan-coordinator:${IMAGE_TAG:-dev}
    container_name: nw-scan-coordinator
    restart: unless-stopped
    env_file:
      - /opt/vulwall/config/general.env
      - /opt/vulwall/config/redis.env
      - /opt/vulwall/config/mongo.env
      - /opt/vulwall/config/honeycomb.env
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${API_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
