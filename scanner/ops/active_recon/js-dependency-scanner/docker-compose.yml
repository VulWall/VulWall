services:
  js-dependency-scanner:
    image: ghcr.io/vulwall/nightwatch-js-dependency-scanner:${IMAGE_TAG:-dev}
    container_name: nightwatch-js-dependency-scanner
    restart: unless-stopped
    env_file:
      - /opt/vulwall/redis.env
      - /opt/vulwall/honeycomb.env
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "js-dependency-scanner"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
