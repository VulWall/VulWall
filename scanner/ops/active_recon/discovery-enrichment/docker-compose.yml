name: nw-discovery-enrichment

services:
  discovery-enrichment:
    image: ghcr.io/vulwall/discovery-enrichment:${IMAGE_TAG:-dev}
    container_name: nw-discovery-enrichment
    restart: unless-stopped
    read_only: true
    stop_grace_period: 30s
    env_file:
      - /opt/vulwall/config/general.env
      - /opt/vulwall/config/redis.env
      - /opt/vulwall/config/honeycomb.env
    environment:
      - IP_ENRICHMENT_DB_PATH=/app/data/dbip-isp-country.mmdb
      - CLOUD_DATA_DIR=/app/cloud-data
    volumes:
      - /opt/vulwall/dbip-isp-country.mmdb:/app/data/dbip-isp-country.mmdb:ro
      - cloud-ip-ranges:/app/cloud-data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "discovery-enrichment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cloud-ip-ranges:
    driver: local

networks:
  core-network:
    external: true
