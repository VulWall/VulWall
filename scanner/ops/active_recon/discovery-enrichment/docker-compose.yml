services:
  discovery-enrichment:
    image: ghcr.io/vulwall/nightwatch-discovery-enrichment:${IMAGE_TAG:-dev}
    container_name: nw-discovery-enrichment
    restart: unless-stopped
    env_file:
      - /opt/vulwall/config/general.env
      - /opt/vulwall/config/redis.env
      - /opt/vulwall/config/honeycomb.env
    environment:
      - IP_ENRICHMENT_DB_PATH=/root/data/dbip-isp-country.mmdb
    volumes:
      - /opt/vulwall/dbip-isp-country.mmdb:/root/data/dbip-isp-country.mmdb:ro
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "discovery-enrichment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
