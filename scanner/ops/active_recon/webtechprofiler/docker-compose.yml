services:
  webtechprofiler:
    build:
      context: ../../..
      dockerfile: ops/active_recon/webtechprofiler/Dockerfile
    container_name: nightwatch-webtechprofiler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URI=${REDIS_URI}
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "webtechprofiler"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
