name: nw-nuclei-scanner

services:
  nuclei-scanner:
    image: ghcr.io/vulwall/nightwatch-nuclei-scanner:${IMAGE_TAG:-dev}
    restart: unless-stopped
    deploy:
      replicas: 5
    env_file:
      - /opt/vulwall/config/general.env
      - /opt/vulwall/config/redis.env
      - /opt/vulwall/config/honeycomb.env
    volumes:
      # Persist Nuclei templates across container restarts
      - nuclei-templates:/root/nuclei-templates
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "nuclei-scanner"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nuclei-templates:
    driver: local

networks:
  core-network:
    external: true
