name: nw-testssl-scanner

services:
  testssl-scanner:
    image: ghcr.io/mojtabatajik/nightwatch-testssl-scanner:${IMAGE_TAG:-dev}
    restart: unless-stopped
    read_only: true
    stop_grace_period: 30s
    deploy:
      replicas: 5
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    env_file:
      - /opt/vulwall/config/general.env
      - /opt/vulwall/config/redis.env
      - /opt/vulwall/config/honeycomb.env
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "testssl-scanner"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
