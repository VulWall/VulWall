services:
  waf-detector:
    build:
      context: ../../..
      dockerfile: ops/active_recon/waf-detector/Dockerfile
    container_name: waf-detector
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      - ENVIRONMENT=production
    networks:
      - vulwall-network
    depends_on:
      - redis
      - mongo

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - vulwall-network

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo-data:/data/db
    networks:
      - vulwall-network

networks:
  vulwall-network:
    driver: bridge

volumes:
  mongo-data:
