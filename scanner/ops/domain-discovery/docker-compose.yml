name: nw-domain-discovery

services:
  domain-discovery:
    image: ghcr.io/vulwall/nightwatch-domain-discovery:${IMAGE_TAG:-dev}
    container_name: nw-domain-discovery
    restart: unless-stopped
    env_file:
      - /opt/vulwall/config/general.env
      - /opt/vulwall/config/redis.env
      - /opt/vulwall/config/shodan.env
      - /opt/vulwall/config/honeycomb.env
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "domain-discovery"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
