name: nw-domain-discovery

services:
  domain-discovery:
    image: ghcr.io/mojtabatajik/nightwatch-domain-discovery:${IMAGE_TAG:-dev}
    container_name: nw-domain-discovery
    restart: unless-stopped
    read_only: true
    stop_grace_period: 30s
    env_file:
      - /opt/vulwall/config/general.env
      - /opt/vulwall/config/redis.env
      - /opt/vulwall/config/honeycomb.env
    # subfinder (runner.NewRunner) writes a default provider config under $HOME/.config/subfinder.
    # The container is read_only, so HOME=/tmp (set in Dockerfile) must back onto a writable tmpfs.
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "domain-discovery"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core-network:
    external: true
