<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4px base — 4 / 8 / 12 / 16 / 24 / 32 / 48" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font-primary); background:var(--surface-card); padding:20px; }
  .r { display:flex; align-items:center; gap:14px; margin-bottom:9px; }
  .tk { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); width:96px; flex-shrink:0; }
  .bar { background:var(--brand-blue); height:14px; border-radius:3px; }
  .px { font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }
</style>
</head>
<body>
  <div class="r"><span class="tk">--space-1</span><span class="bar" style="width:4px"></span><span class="px">4px</span></div>
  <div class="r"><span class="tk">--space-2</span><span class="bar" style="width:8px"></span><span class="px">8px</span></div>
  <div class="r"><span class="tk">--space-3</span><span class="bar" style="width:12px"></span><span class="px">12px</span></div>
  <div class="r"><span class="tk">--space-4</span><span class="bar" style="width:16px"></span><span class="px">16px</span></div>
  <div class="r"><span class="tk">--space-6</span><span class="bar" style="width:24px"></span><span class="px">24px</span></div>
  <div class="r"><span class="tk">--space-8</span><span class="bar" style="width:32px"></span><span class="px">32px</span></div>
  <div class="r"><span class="tk">--space-12</span><span class="bar" style="width:48px"></span><span class="px">48px</span></div>
</body>
</html>
