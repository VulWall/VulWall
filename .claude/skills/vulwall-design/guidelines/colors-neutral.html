<!-- @dsCard group="Colors" viewport="700x130" name="Neutral ramp" subtitle="Navy-tuned slate — borders, text, chrome" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font-primary); background:var(--surface-card); padding:20px; }
  .ramp { display:flex; border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--border-default); }
  .step { flex:1; height:88px; display:flex; align-items:flex-end; padding:8px; }
  .lbl { font-family:var(--font-mono); font-size:10px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="step" style="background:var(--vw-gray-0)"><span class="lbl" style="color:var(--vw-gray-400)">0</span></div>
    <div class="step" style="background:var(--vw-gray-50)"><span class="lbl" style="color:var(--vw-gray-400)">50</span></div>
    <div class="step" style="background:var(--vw-gray-100)"><span class="lbl" style="color:var(--vw-gray-400)">100</span></div>
    <div class="step" style="background:var(--vw-gray-200)"><span class="lbl" style="color:var(--vw-gray-500)">200</span></div>
    <div class="step" style="background:var(--vw-gray-300)"><span class="lbl" style="color:var(--vw-gray-600)">300</span></div>
    <div class="step" style="background:var(--vw-gray-400)"><span class="lbl" style="color:#fff">400</span></div>
    <div class="step" style="background:var(--vw-gray-500)"><span class="lbl" style="color:#fff">500</span></div>
    <div class="step" style="background:var(--vw-gray-600)"><span class="lbl" style="color:#fff">600</span></div>
    <div class="step" style="background:var(--vw-gray-700)"><span class="lbl" style="color:#fff">700</span></div>
    <div class="step" style="background:var(--vw-gray-800)"><span class="lbl" style="color:#fff">800</span></div>
    <div class="step" style="background:var(--vw-gray-900)"><span class="lbl" style="color:#fff">900</span></div>
  </div>
</body>
</html>
