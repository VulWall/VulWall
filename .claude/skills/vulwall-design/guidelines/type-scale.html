<!-- @dsCard group="Type" viewport="700x280" name="Type scale" subtitle="Display down to caption" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font-primary); background:var(--surface-card); padding:8px 20px; }
  .r { display:flex; align-items:baseline; gap:18px; padding:10px 0; border-bottom:1px solid var(--vw-gray-100); }
  .r:last-child { border-bottom:0; }
  .tk { font-family:var(--font-mono); font-size:11px; color:var(--text-faint); width:96px; flex-shrink:0; }
  .sp { color:var(--text-heading); }
</style>
</head>
<body>
  <div class="r"><span class="tk">display / 44</span><span class="sp" style="font-size:40px; font-weight:700; letter-spacing:-.02em;">Find what attackers see</span></div>
  <div class="r"><span class="tk">h1 / 28</span><span class="sp" style="font-size:28px; font-weight:700;">Continuous external monitoring</span></div>
  <div class="r"><span class="tk">h2 / 24</span><span class="sp" style="font-size:24px; font-weight:600;">What we found on your perimeter</span></div>
  <div class="r"><span class="tk">h3 / 20</span><span class="sp" style="font-size:20px; font-weight:600;">Outdated OpenSSL on the API</span></div>
  <div class="r"><span class="tk">body / 16</span><span class="sp" style="font-size:16px; font-weight:400; color:var(--text-body);">Plain-English findings, ranked by what actually matters.</span></div>
  <div class="r"><span class="tk">caption / 13</span><span class="sp" style="font-size:13px; color:var(--text-muted);">Last scan 4 hours ago · 12 scanners</span></div>
</body>
</html>
